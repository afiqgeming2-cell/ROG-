<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ROG Phone 9 Web UI</title>
<style>
:root{--rog:#ff003c;--bg:#050505}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#000;height:100vh;display:flex;justify-content:center;align-items:center;color:#fff}
#phone{width:420px;height:860px;border-radius:40px;overflow:hidden;position:relative;
background:linear-gradient(180deg,#121212,#050505);border:2px solid var(--rog);
box-shadow:0 0 25px rgba(255,0,60,.5)}
.screen{position:absolute;inset:0}
.hidden{display:none}
#aod,#lock{display:flex;flex-direction:column;justify-content:center;align-items:center}
.time{font-size:84px;font-weight:900;text-shadow:0 0 15px var(--rog)}
.date{opacity:.8}
#home{padding:16px}
.status{display:flex;justify-content:space-between}
.island{width:120px;height:30px;background:#000;border-radius:20px;margin:8px auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.widget{background:#151515;border:1px solid #333;border-radius:24px;padding:14px;text-align:center}
.big{height:130px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.app{background:#171717;border:1px solid #333;border-radius:20px;height:72px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dock{position:absolute;bottom:15px;left:15px;right:15px;height:90px;background:#111;border-radius:28px;display:flex;justify-content:space-evenly;align-items:center}
.panel{position:absolute;left:0;right:0;top:-360px;height:360px;background:#111;transition:.4s;padding:16px;z-index:9}
.panel.show{top:0}
.toggle{padding:12px;background:#222;border-radius:12px;margin:8px 0;cursor:pointer}
.rgb{animation:glow 2s infinite alternate}
@keyframes glow{from{box-shadow:0 0 5px var(--rog)}to{box-shadow:0 0 25px var(--rog)}}
button{padding:10px 16px;border:none;border-radius:10px;background:var(--rog);color:#fff}
</style>
</head>
<body>
<div id="phone" class="rgb">

<div id="boot" class="screen" style="display:flex;align-items:center;justify-content:center;background:#000;z-index:20">
<div>
<h1 style="color:#ff003c">ROG PHONE 9</h1>
<p>Booting...</p>
</div>
</div>

<div id="aod" class="screen hidden">
<div class="time" id="aodTime"></div>
<div class="date" id="aodDate"></div>
<button onclick="showLock()">Wake</button>
</div>

<div id="lock" class="screen hidden">
<div class="time" id="lockTime"></div>
<div class="date">Swipe Up (tap layar)</div>
</div>

<div id="home" class="screen hidden">
<div class="panel" id="cc">
<h2>ROG Control Center</h2>
<div class="toggle">Wi‑Fi</div>
<div class="toggle">Bluetooth</div>
<div class="toggle">Flashlight</div>
<div class="toggle">165Hz Mode</div>
<button onclick="toggleCC()">Tutup</button>
</div>

<div class="status"><span id="statusTime"></span><span>🔋92%</span></div>
<div class="island"></div>

<h1 class="time" style="font-size:64px" id="homeTime"></h1>

<div class="grid">
<div class="widget big">🎮<br>Armoury Crate</div>
<div class="widget big">🌤️<br>28°C</div>
<div class="widget">🎵 Music</div>
<div class="widget" onclick="toggleCC()">⚡ Quick Panel</div>
</div>

<div class="apps">
<div class="app" onclick="openApp('Settings')">⚙️</div>
<div class="app" onclick="openApp('Gallery')">🖼️</div>
<div class="app" onclick="openApp('Calculator')">🧮</div>
<div class="app" onclick="openApp('Browser')">🌐</div>
</div>

<div class="dock">
<div class="app">🎮</div>
<div class="app">📁</div>
<div class="app">🎵</div>
<div class="app">💬</div>
</div>
</div>

</div>

<script>
const boot=document.getElementById('boot');
setTimeout(()=>{
boot.style.display='none';
document.getElementById('aod').classList.remove('hidden');
},2500);

function tick(){
const d=new Date();
const t=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
document.querySelectorAll('#aodTime,#lockTime,#homeTime,#statusTime').forEach(e=>{if(e)e.textContent=t});
const dt=d.toDateString();
const ad=document.getElementById('aodDate'); if(ad) ad.textContent=dt;
}
setInterval(tick,1000); tick();

function showLock(){
document.getElementById('aod').classList.add('hidden');
document.getElementById('lock').classList.remove('hidden');
}
document.getElementById('lock').onclick=()=>{
document.getElementById('lock').classList.add('hidden');
document.getElementById('home').classList.remove('hidden');
}

function toggleCC(){document.getElementById('cc').classList.toggle('show')}

function openApp(name){
alert(name+" demo app");
}
</script>
</body>
</html>
